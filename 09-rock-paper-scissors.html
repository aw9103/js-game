    <!DOCTYPE html>
        <html>
            <head>
                <title>Mini Rock Paper Scissors</title>
            </head>
            <body>
            <link
            rel="stylesheet";
            href="styles/09-rock-paper-scissors.css">

            <p class="title">Mini Rock Paper Scissors</p>

            <button 
            class='move-button1 js-rock-button'
            >Rock
            <img src="images\rock-emoji.png"  class="move-icon">
            </button>
            <button 
            class='move-button2 js-paper-button'
            >Paper
            <img src="images\paper-emoji.png"  class="move-icon">
            </button>
            <button 
            class='move-button3 js-scissors-button'
            >Scissors
            <img src="images\scissors-emoji.png"  class="move-icon">
            </button>
            <p class="js-result result"></p>
            <p class="js-moves">
            </p>
            <p class="js-score"></p>
            <button onclick="
            localStorage.removeItem('score');
            location.reload();
            "class="reset-score-button"
            >Reset Game</button>
            <button class="auto-play-button" onclick="
            autoPlay();
            ">Auto Play</button>
            <script src="scripts/09-rock-paper-scissors.js"></script>
            </body>
        </html>
