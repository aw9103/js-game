    <!DOCTYPE html>
    <html>
        <head>
            <title>DOM</title>
            <style>
                 body{
                    font-family: Arial, Helvetica, sans-serif;
                 }
                .subscribe-button{
                background-color: black;
                color: white;
                padding-top: 10px;
                padding-bottom: 10px;
                padding-left: 15px;
                padding-right: 15px;
                font-weight: bold;
                border-radius: 5dvh;
                cursor: pointer;
                margin-bottom: 30px;
                }
                .is-subscribed{
                    background-color:  lightgrey;
                    color: black;
                    border: 1px solid #ccc;
                }
                .cost-input{
                    font-size: 15px;
                    padding: 10px;
                }
                .calculate-button{
                    background-color: green;
                    color: white;
                    border: none;
                    font-size: 15px;
                    padding: 12px 15px;
                    cursor: pointer;
                }
               
            </style>
        </head>
        <body>
            <p>Youtube Subscribe Button</p>
            <button onclick="
            subscribe();
            "class='js-button subscribe-button'> 
            Subscribe</button>
            <p>Amazon Shipping Calculator</p>
            <input Placeholder='Cost of order' class='js-cost cost-input'
            onkeydown="
            handleCostKeyDown(event);
            "
            >
            <button onclick="
            "class='calculate-button'
            calculateTotal();
            ">Calculate</button>
            <p class='js-total'></p>
        <script>
            function subscribe(){
                const buttonElement=document.querySelector('.js-button');
                if(buttonElement.innerText==='Subscribe'){
                    buttonElement.innerText='Subscribed';
                    buttonElement.classList.add('is-subscribed');
                }
                else{
                    buttonElement.innerText='Subscribe';
                    buttonElement.classList.remove('is-subscribed');
                }
            }
            function handleCostKeyDown(event){
                if(event.key==='Enter'){
                    calculateTotal();
                }

            }
        
            function calculateTotal(){
                const inputElement=document.querySelector('.js-cost');
                let cost=Number(inputElement.value);
                if(cost<40){
                    cost=cost+10;
                }
                document.querySelector('.js-total').innerHTML=`Total Cost: ${cost}$`;
            }
           
        </script>
        </body>
    </html>
