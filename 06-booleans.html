<!DOCTYPE html>
    <html>
        <head>
            <title>Mini Rock Paper Scissors</title>
        </head>
        <body>
        
        <p>Mini Rock Paper Scissors</p>

        <button onclick="
            playGame('rock');
        ">Rock</button>
        <button onclick="
            playGame('paper');
        ">Paper</button>
        <button onclick="
            playGame('scissors');
            ">Scissors</button>
        <button onclick="
        localStorage.removeItem('score');
        location.reload();
        ">Reset Game</button>
            <script>
            let score=JSON.parse(localStorage.getItem('score'));
            if(score===null){
                score={
                    wins: 0,
                    losses: 0,
                    ties: 0
                };
            }


            function playGame(playerMove){
                const computerMove = pickComputerChoice();
                let result = '';
                if(playerMove==='scissors'){
                    if(computerMove==='scissors'){
                        result = 'Draw';
                    }
                    else if(computerMove==='rock'){
                        result = 'You Lose';
                    }
                    else if(computerMove==='paper'){
                        result = 'You Win';
                    }
                }
                else if(playerMove==='rock') {
                    if(computerMove==='scissors'){
                        result = 'You Win';
                    }
                    else if(computerMove==='rock'){
                        result = 'Draw';
                    }
                    else if(computerMove==='paper'){
                        result = 'You Lose';
                    }
                }
                else if(playerMove==='paper') {
                    if(computerMove==='scissors'){
                        result = 'You Lose';
                    }
                    else if(computerMove==='rock'){
                        result = 'You Win';
                    }
                    else if(computerMove==='paper'){
                        result = 'Draw';
                    }
                }
                if(result==='You Win'){
                    score.wins++;
                }
                else if(result==='You Lose'){
                    score.losses++;
                }
                else if(result==='Draw'){
                    score.ties++;
                }

                localStorage.setItem('score',JSON.stringify(score));

                alert(`You picked ${playerMove}. Computer picked ${computerMove}\n ${result}. \nWins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
            }

            function pickComputerChoice(){
                const randomNumber = Math.random();
                if(randomNumber < 0.33){
                    return 'rock';
                }
                else if(randomNumber < 0.66){
                    return 'paper';
                }
                else{
                    return 'scissors';
                }
            }
            const object4={
                message: 'goodJob'
            };
            const object5={
                message,
                method: function function1(){
                    console.log('method');
                }
            };
            console.log(object5);
            </script>
        </body>
    </html>
